version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ecogreen_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecogreen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecogreen_secret}
      POSTGRES_DB: ${POSTGRES_DB:-ecogreen_db}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ecogreen_network

  redis:
    image: redis:7-alpine
    container_name: ecogreen_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - ecogreen_network

volumes:
  postgres_data:
  redis_data:

networks:
  ecogreen_network:
    driver: bridge
